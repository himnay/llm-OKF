spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama4:scout
  datasource:
    url: jdbc:postgresql://localhost:5432/okf
    username: okf
    password: okf
  flyway:
    enabled: false
  mongodb:
    uri: mongodb://localhost:27017/okf-test

app:
  okf:
    knowledge-base-path: /tmp/okf-test
    max-files-per-query: 5
    navigation-model: llama4:scout
    extraction-model: llama4:scout
    sync:
      github-url: https://github.com/test/test
      github-token: ""
      interval-ms: 3600000
      enabled: false
      sync-on-startup: false
      use-llm-summarization: false
    llm-models:
      knowledge-base-path: /tmp/okf-test-llm-models
      query-base-path: /tmp/okf-test-llm-models-live
      api-url: https://huggingface.co/api/models
      min-models: 50
      page-size: 50
      interval-ms: 86400000
      enabled: false
      sync-on-startup: false
      hf-token: ""
